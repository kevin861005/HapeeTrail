spring.application.name=hapeetrail

# 機密與環境相關的設定不進 repo，一律由部署平台的環境變數注入：
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
#   HAPEETRAIL_JWT_ISSUER          （= https://<專案ref>.supabase.co/auth/v1）
#   HAPEETRAIL_GOTRUE_SECRET_KEY   （sb_secret_…，只給註銷呼叫 GoTrue Admin API 用）
# 缺了就啟動失敗，這是刻意的。

# GoTrue 的網址（註銷打它的 Admin API）。hosted 上它就是簽 token 的那個發行者，同一個值；
# 測試換成 fake GoTrue。
hapeetrail.gotrue.url=${hapeetrail.jwt.issuer}

# 連線與等回應各自的上限。註銷是低頻操作，寧可早一點回契約裡的 500，
# 也不要讓一條 thread 卡到平台的請求逾時（Cloud Run 300s）才由平台回一個 504。
hapeetrail.gotrue.timeout=10s

# Supabase 的連線數是共用資源，池子取小。
spring.datasource.hikari.maximum-pool-size=5

# 只開 health，其餘 actuator 端點關閉。
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 隱私：request body 與查詢參數永不落日誌（座標與便條內容都在裡面）。
spring.mvc.log-request-details=false

# GoTrue 簽的 token 一律 aud=authenticated；不是這個值就不是給我們的。
# 但 authenticated 是**每個** Supabase 專案的共同值——擋跨專案 token 的第二道是 iss，
# 由 hapeetrail.jwt.issuer 驗（見 SecurityConfig；不能用 Boot 的 issuer-uri，它與測試用的
# public-key-location 互斥）。
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

# 請求層的字串上限（T35）：任何 JSON 字串值超過 65,536 個字元 → Jackson 在解析時就拋
# StreamConstraintsException → 400 沒有 code。便條上限 500、暱稱 20，這是留給「trim 前的空白」
# 的餘裕；沒有這道，trim 與後續處理的成本由 client 決定（Jackson 3 預設是一億）。
# 設在 Boot 的屬性而不是 JsonConfig：Jackson 3 的限制掛在 JsonFactory 上，mapper builder
# 碰不到；Boot 自己的 factory customizer（order 0）又會整份覆寫 StreamReadConstraints。
spring.jackson.factory.constraints.read.max-string-length=65536

# 請求體總量上限（T36）：上面那道只限單一字串，整份 body 的總量原本不受限（兩個都是 -1）——
# 8MB 的 {"keys":[…200 萬個]} 會先整份解析成約 109MB 的物件，才輪到 MAX_KEYS 擋。以下三道都在
# 解析途中就拋 StreamConstraintsException → 400 沒有 code，與上面同一條路、同一個理由設在這裡。
#
# 文件長度，單位是 **bytes**（UTF-8 body 走 UTF8StreamJsonParser，每讀進一塊緩衝就以累計 bytes
# 驗一次；若 Content-Type 宣告別的字元集，Spring 改用 Reader，單位變 char——仍有界）。
# 最大的合法請求是便條：content 最多 65,536 個 char（上面那道）× UTF-8 每個 char 最多 3 bytes
# （U+0800–U+FFFF；補充平面是 2 個 char 共 4 bytes，平均更少）= 196,608 bytes，
# ＋ 座標、color／style／audience 與鍵名不到 200 bytes ⇒ < 197 KB < 256 KiB = 262,144。
# 例外：把非 ASCII 全寫成 \uXXXX 逸出（每個 char 6 bytes）時，超過約 43,000 個 char 會被擋——
# 但 trim 後的便條最多 500 code point，只有「幾萬個頭尾空白」才會撞到，那不是合法用法。
spring.jackson.factory.constraints.read.max-document-length=262144
# token 數：JsonParser 每吐一個 JsonToken 算一個（START_OBJECT、PROPERTY_NAME、VALUE_*、END_* 各算一）。
# token 最多的合法請求是 flags 問滿 50 個 key：{ keys [ 50 個字串 ] } = 55 個；便條全欄位約 15 個。
# 10,000 是兩個數量級的餘裕，同時把 256 KiB 內最便宜的灌法（數萬個 {"k":0}）擋在物件化之前。
spring.jackson.factory.constraints.read.max-token-count=10000
# 屬性名長度（UTF-8 body 下單位是 bytes）：契約裡最長的鍵是 coordinate／longitude，Jackson 預設 50,000。
spring.jackson.factory.constraints.read.max-name-length=256

# 非 JSON 的 body（T37）：API 只收 JSON，以下兩個框架預設都關掉。關掉後表單與 multipart 一律走
# MVC 的「沒有 converter 讀得了」→ 415 沒有 code（ApiErrors.handleExceptionInternal）；沒 token 的照樣
# 先被 Security 擋成 401——PUT／PATCH／DELETE 的表單與 multipart 都不再讀 body。
# POST 表單原本仍會在 MVC 層被 Tomcat 自己解析（上限 max-http-form-post-size 2MB，超過變 500）——T38 已修：
# TomcatConfig 把 Connector 的 parseBodyMethods 設成空字串，Tomcat 不解析 urlencoded 表單 body（multipart 由 T37 關掉），POST 表單同樣 415。
#
# FormContentFilter（Boot 預設開，order -9900，早於 Security 的 -100）：PUT／PATCH／DELETE 帶
# application/x-www-form-urlencoded 時，它在**驗證身分之前**就把整份 body 讀進記憶體解析成參數。
# 匿名、無 token 就能讓服務吃下 Cloud Run 單請求上限 32MiB 的 body；Tomcat 的
# max-http-form-post-size 只管 POST 表單，管不到它，上面的 Jackson 上限也管不到（根本沒走 Jackson）。
spring.mvc.formcontent.filter.enabled=false
# multipart（Boot 預設開，file-size-threshold 0B ⇒ 每個 part 都寫暫存檔）：Cloud Run 的磁碟是 tmpfs，
# 寫檔＝吃記憶體，而 /v1/app/* 免登入就能送。關掉後沒有 MultipartResolver、Tomcat 也沒有 multipart
# 設定，multipart body 不會被解析。
spring.servlet.multipart.enabled=false
