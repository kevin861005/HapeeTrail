spring.application.name=hapeetrail

# 機密與環境相關的設定不進 repo，一律由部署平台的環境變數注入：
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
# 缺了就啟動失敗，這是刻意的。

# Supabase 的連線數是共用資源，池子取小。
spring.datasource.hikari.maximum-pool-size=5

# 只開 health，其餘 actuator 端點關閉。
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 隱私：request body 與查詢參數永不落日誌（座標與便條內容都在裡面）。
spring.mvc.log-request-details=false

# GoTrue 簽的 token 一律 aud=authenticated；不是這個值就不是給我們的。
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
