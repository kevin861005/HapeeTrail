spring.application.name=hapeetrail

# 機密與環境相關的設定不進 repo，一律由部署平台的環境變數注入：
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
#   HAPEETRAIL_JWT_ISSUER          （= https://<專案ref>.supabase.co/auth/v1）
#   HAPEETRAIL_GOTRUE_SECRET_KEY   （sb_secret_…，只給註銷呼叫 GoTrue Admin API 用）
# 缺了就啟動失敗，這是刻意的。

# GoTrue 的網址（註銷打它的 Admin API）。hosted 上它就是簽 token 的那個發行者，同一個值；
# 測試換成 fake GoTrue。
hapeetrail.gotrue.url=${hapeetrail.jwt.issuer}

# 連線與等回應各自的上限。註銷是低頻操作，寧可早一點回契約裡的 500，
# 也不要讓一條 thread 卡到平台的請求逾時（Cloud Run 300s）才由平台回一個 504。
hapeetrail.gotrue.timeout=10s

# Supabase 的連線數是共用資源，池子取小。
spring.datasource.hikari.maximum-pool-size=5

# 只開 health，其餘 actuator 端點關閉。
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 隱私：request body 與查詢參數永不落日誌（座標與便條內容都在裡面）。
spring.mvc.log-request-details=false

# GoTrue 簽的 token 一律 aud=authenticated；不是這個值就不是給我們的。
# 但 authenticated 是**每個** Supabase 專案的共同值——擋跨專案 token 的第二道是 iss，
# 由 hapeetrail.jwt.issuer 驗（見 SecurityConfig；不能用 Boot 的 issuer-uri，它與測試用的
# public-key-location 互斥）。
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
