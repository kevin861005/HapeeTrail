<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailstamp Notes API</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
  .banner { background:#1F5F5B; color:#fff; padding:14px 20px; font-size:.85rem; line-height:1.6; }
  .banner b { font-weight:600; }
  .banner a { color:#BFE9E2; }
  .banner code { background:rgba(255,255,255,.14); padding:.1em .4em; border-radius:3px; }
  .swagger-ui .topbar { display:none; }
</style>
</head>
<body>
<div class="banner">
  <b>Trailstamp 第一階段便條 API</b> —— 契約的權威來源是本 repo 的
  <code>docs/api/openapi.yaml</code>，本頁只是它的呈現。
  語意規則與完整 curl 範例見 <a href="https://github.com/kevin861005/HapeeTrail/blob/main/docs/api/notes.md">notes.md</a>；
  <code>color</code>／<code>style</code> 對照表見
  <a href="https://github.com/kevin861005/HapeeTrail/blob/main/docs/api/style-codes.md">style-codes.md</a>（由 iOS 維護）。
  要用「Try it out」請先在右上 Authorize 填入 publishable key。
</div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
<script>
window.onload = () => {
  window.ui = SwaggerUIBundle({
    url: './api/openapi.yaml',
    dom_id: '#swagger-ui',
    deepLinking: true,
    presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
    layout: 'BaseLayout',
    tryItOutEnabled: true,
    persistAuthorization: true,
    defaultModelsExpandDepth: 1,
    docExpansion: 'list'
  });
};
</script>
</body>
</html>
